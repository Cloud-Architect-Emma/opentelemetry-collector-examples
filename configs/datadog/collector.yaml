# Datadog Collector Config
# Replace <YOUR_DD_API_KEY> with your Datadog API key
#
# NOTE: Depending on your collector-contrib version, you may also need
# to configure the datadog connector. See:
# https://docs.datadoghq.com/opentelemetry/collector_exporter/

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
  resourcedetection:
    detectors: [env, system]

exporters:
  datadog:
    api:
      key: <YOUR_DD_API_KEY>
      site: datadoghq.com

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, resourcedetection]
      exporters: [datadog]
    metrics:
      receivers: [otlp]
      processors: [batch, resourcedetection]
      exporters: [datadog]
    logs:
      receivers: [otlp]
      processors: [batch, resourcedetection]
      exporters: [datadog]
